name: request client release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: release version, such as v0.1.0
        type: string
        required: true
      source_ref:
        description: branch or tag in the private source repository
        type: string
        default: main
        required: true

permissions: {}

jobs:
  request:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: request private build
        env:
          GH_TOKEN: ${{ secrets.SOURCE_BUILD_TOKEN }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?set SOURCE_BUILD_TOKEN with actions write access to the private source repository}"
          : "${SOURCE_REPOSITORY:?set SOURCE_REPOSITORY to the private owner/repository}"
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || ${#RELEASE_TAG} -gt 40 ]]; then
            echo 'release tags must use v0.0.0' >&2
            exit 1
          fi
          if [[ ! "$SOURCE_REPOSITORY" =~ ^[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+$ || -z "$SOURCE_REF" ]]; then
            echo 'set a valid source repository and ref' >&2
            exit 1
          fi
          if [[ "$(gh api "repos/$SOURCE_REPOSITORY" --jq .private)" != true ]]; then
            echo 'the source repository must be private' >&2
            exit 1
          fi
          jq -n --arg ref "$SOURCE_REF" --arg tag "$RELEASE_TAG" \
            '{ref: $ref, inputs: {release_tag: $tag}}' > "$RUNNER_TEMP/build-request.json"
          gh api --method POST "repos/$SOURCE_REPOSITORY/actions/workflows/prisoncpp.yml/dispatches" \
            --input "$RUNNER_TEMP/build-request.json" --silent
          echo 'private build requested; packages appear in releases after all platform checks pass'
